set-option -g prefix C-a
unbind C-b
bind C-a send-prefix

unbind r
bind r source-file ~/.tmux.conf
bind-key l last-window

# Enable Vim keys in copy mode
setw -g mode-keys vi

# Use Vim-like keybindings for copy-mode (optional but recommended)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

setw -g mode-keys vi

set-option -g default-shell ${SHELL}
set-option -sg escape-time 10
set-option -g focus-events on

set -gq status-utf8 on
set-option -g default-terminal "tmux-256color"
set-option -ag terminal-features ",xterm-256color:RGB"

set -g status-position top

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'christoomey/vim-tmux-navigator'


# Theme: the powerline bar omarchy generates, but in palette colours instead of
# hardcoded hex, so it follows whatever theme is set and stays legible on light
# themes too. brightblack stands in for the generated bar background.
set -g status-style "bg=brightblack,fg=default"
set -g status-interval 5
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator ""

# Session segment, red while the prefix is held
set -g status-left "#{?client_prefix,#[fg=black#,bg=red#,bold],#[fg=black#,bg=blue#,bold]} #S #{?client_prefix,#[fg=red#,bg=brightblack#,nobold],#[fg=blue#,bg=brightblack#,nobold]} #{?pane_in_mode,#[fg=yellow]COPY ,}#{?window_zoomed_flag,#[fg=yellow]ZOOM ,}"

# Inactive windows use the terminal foreground rather than a dim grey, which is
# what made them hard to read
setw -g window-status-format "#[fg=default,bg=brightblack] #I  #W "
setw -g window-status-current-format "#[fg=brightblack,bg=blue]#[fg=black,bg=blue,bold] #I  #W #[fg=blue,bg=brightblack,nobold]"

set -g status-right "#[fg=blue,bg=brightblack]#[fg=black,bg=blue] #{b:pane_current_path} #[fg=magenta,bg=blue]#[fg=black,bg=magenta] %Y-%m-%d %H:%M "

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# TMUX Resurrect
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'on'

# TMUX Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'  # Save every 15 minutes

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
