# AeroSpace: a deliberately small starting point, to grow toward Hyprland one
# habit at a time (see aerospace/README.md for what to try next).
#
# Every binding uses alt (Option), AeroSpace's own default, so macOS app
# shortcuts on Command stay untouched.
#
# Docs: https://nikitabobko.github.io/AeroSpace/guide
#       https://nikitabobko.github.io/AeroSpace/commands

config-version = 2
start-at-login = true

persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Keep the mouse with the focus when jumping between monitors.
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# Cmd+H would otherwise hide windows where AeroSpace cannot tile them.
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

# exec-and-forget starts with launchd's bare PATH, which lacks Homebrew (where
# the aerospace CLI lives) and ~/.local/bin.
[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:${HOME}/.local/bin:${PATH}'

# Hyprland's gaps_in = 3 applies per side, so 6 between two windows.
[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 5
outer.bottom = 5
outer.top = 5
outer.right = 5

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Close, quitting the app on its last window, and stay on this workspace
# (see aerospace/bin/aerospace-close for why this needs a script).
alt-w = 'exec-and-forget ~/.local/bin/aerospace-close'
alt-f = 'fullscreen'
alt-t = 'layout floating tiling'
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-6 = 'workspace 6'
alt-7 = 'workspace 7'
alt-8 = 'workspace 8'
alt-9 = 'workspace 9'

alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'
alt-shift-6 = 'move-node-to-workspace --focus-follows-window 6'
alt-shift-7 = 'move-node-to-workspace --focus-follows-window 7'
alt-shift-8 = 'move-node-to-workspace --focus-follows-window 8'
alt-shift-9 = 'move-node-to-workspace --focus-follows-window 9'

alt-tab = 'workspace --wrap-around next'
alt-shift-tab = 'workspace --wrap-around prev'

alt-shift-semicolon = 'mode service'

# alt-shift-; then one key. Esc also reloads this file after an edit.
[mode.service.binding]
esc = ['reload-config', 'mode main']
r = ['flatten-workspace-tree', 'mode main']
f = ['layout floating tiling', 'mode main']
backspace = ['close-all-windows-but-current', 'mode main']

# Windows that should float rather than tile.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'
